name: Bug report
description: Report a reproducible problem without exposing sensitive data.
title: '[Bug]: '
labels: ['bug']
body:
  - type: textarea
    id: behaviour
    attributes:
      label: What happened?
      description: Do not include credentials, private URLs, or customer data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
